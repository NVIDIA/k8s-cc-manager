# Verifies that the committed THIRD_PARTY_NOTICES.md still describes this tree.
#
# This job does not regenerate the document. requirements.txt constrains only
# `kubernetes>=28.1.0` and there is no lock file, so the resolved closure
# changes whenever PyPI publishes a new version of any dependency; a
# regenerate-and-diff gate would need network access on every build and would
# fail on days this repository did not change. Instead the generator records its
# inputs in the document -- the sha256 of requirements.txt, the builder Python
# version, the released platforms and the Dockerfile's post-install pins -- and
# this job re-derives those from the tree and compares. That catches the failure
# that matters, a dependency change landing without refreshed attribution,
# offline and in seconds.
#
# Refreshing the versions themselves is a deliberate step: run
# `make -f deployments/container/Makefile notices` and commit the result.

name: Third-Party Notices

on:
  push:
    branches:
      - main
      - release-*
  pull_request:
    branches:
      - main
      - release-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notices-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify THIRD_PARTY_NOTICES.md describes this tree
        run: make -f deployments/container/Makefile notices-check
